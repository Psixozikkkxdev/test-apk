name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Gradle & Build
        run: |
          mkdir -p app
          cat << 'EOF' > build.gradle
          buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          echo "include ':app'" > settings.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android { namespace 'com.helper.testoverlay'; compileSdk 34; defaultConfig { applicationId "com.helper.testoverlay"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } }
          EOF
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
